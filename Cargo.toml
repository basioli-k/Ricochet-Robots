[workspace]
resolver = "3"
members = ["crates/domain", "crates/storage", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
storage = { path = "crates/storage" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The solver searches thousands of positions; unoptimised it makes the domain
# tests ~10x slower. Debug assertions stay on (they are a separate setting).
[profile.dev.package.domain]
opt-level = 2
