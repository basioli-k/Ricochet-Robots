[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
domain.workspace = true
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
storage.workspace = true
thiserror = "2.0.21"
time = "0.3.44"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-sessions = "0.15.0"
tower-sessions-core = { version = "0.15.0", features = ["deletion-task"] }
tower-sessions-sqlx-store = { version = "0.16.0", features = ["sqlite"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
