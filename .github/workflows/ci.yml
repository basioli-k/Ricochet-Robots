name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per PR (superseded runs are cancelled) and one per commit on
  # main, so every commit there is checked even when pushes queue up.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # Third-party action pinned to a commit (v2.9.3).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The tests regenerate the protocol's TypeScript types from scratch;
      # they must match what is committed, so a removed type fails too.
      - run: rm -rf web/src/protocol
      - run: cargo test --workspace --locked
      - name: Protocol types are current
        run: |
          git diff --exit-code -- web/src/protocol
          test -z "$(git status --porcelain -- web/src/protocol)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Exact version (released 2026-11-11), pinned so CI doesn't take
          # releases younger than 14 days.
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: web/package-lock.json
      # No dependency needs an install script on Linux; skipping them all
      # limits what a compromised package could run.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # The round waits 60 s for bidding; anything near this limit is a hang.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      # The browser build matching the pinned @playwright/test, downloaded
      # from Playwright's own CDN (owner-approved for end-to-end tests).
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Built first so the test's server start fits its timeout.
      - run: cargo build --locked -p server
      - run: npm run e2e
        working-directory: web
      # Traces of failed tests, for `npx playwright show-trace`.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-traces
          path: web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t ricochet-robots .
      # The container must start, answer health checks and serve the client.
      # Starting a session writes to SQLite in /data as the unprivileged user.
      - name: Smoke-test the image
        run: |
          docker run -d --name rr -p 8080:8080 ricochet-robots
          for _ in $(seq 1 30); do curl -sf --max-time 5 localhost:8080/health && break; sleep 1; done
          curl -sf --max-time 5 localhost:8080/health
          curl -sf --max-time 5 localhost:8080/ | grep -q '<div id="app">'
          curl -sf --max-time 5 localhost:8080/api/session | grep -q '"csrf"'
          docker exec rr test -s /data/ricochet.db
          test "$(docker exec rr id -u)" != 0
      - if: failure()
        run: docker ps -a && docker logs rr
